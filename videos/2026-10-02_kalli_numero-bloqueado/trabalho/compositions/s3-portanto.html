      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 30;

          // virada clara — revelação radial a partir da notificação
          tl.fromTo("#s3-light", { clipPath: "circle(0px at 540px 760px)" }, { clipPath: "circle(2300px at 540px 760px)", duration: 0.7, ease: "power3.in" }, 0);
          tl.fromTo("#s3-phone", { y: 600 }, { y: 0, duration: 0.8, ease: "power3.out" }, 0.05);
          tl.fromTo("#s3-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // notificação no acento (ping em 0.3)
          tl.fromTo("#s3-notif", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.3);
          tl.fromTo("#s3-notif .ic", { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.35);
          tl.to("#s3-notif", { y: -220, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.35);
          // cabeçalho da conversa aparece quando a notificação sai
          tl.fromTo("#s3-chathead > *", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.05 }, 1.55);

          // pergunta — waterfall
          let at = 0.75;
          gsap.utils.toArray("#s3-h1 .w").forEach((el, i) => {
            const heavy = i === 4 || i === 6 || i === 9 || i === 12;
            const dur = heavy ? 0.17 : 0.12;
            tl.set(el, { opacity: 1, y: heavy ? 64 : 42 }, at);
            tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, at);
            at += dur - F;
          });
          tl.to("#s3-h1", { y: -40, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.95);

          // conversa
          const pop = (sel, t) => tl.fromTo(sel, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, t);
          pop("#s3-m1", 1.6);
          pop("#s3-ty1", 2.2);
          // pontos digitando (finito)
          gsap.utils.toArray("#s3-ty1 i").forEach((d, i) => {
            tl.fromTo(d, { y: 0 }, { y: -10, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.3 + i * 0.09);
          });
          // indicador some, resposta ocupa o lugar
          tl.to("#s3-ty1", { opacity: 0, duration: 0.1 }, 2.95);
          tl.set("#s3-ty1", { height: 0, marginBottom: 0 }, 3.0);
          pop("#s3-m2", 3.0);
          tl.fromTo("#s3-meta", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 3.35);
          pop("#s3-m3", 4.4);

          // conversa sobe para abrir espaço (nudge-curve)
          const T = 5.2, D = -250;
          tl.to("#s3-chat", { y: D * 0.1, duration: 0.12, ease: "power3.in" }, T);
          tl.to("#s3-chat", { y: D * 0.75, duration: 0.1, ease: "none" }, T + 0.12);
          tl.to("#s3-chat", { y: D, duration: 0.38, ease: "power4.out" }, T + 0.22);

          // cartão de visita agendada (pop em 5.6)
          tl.fromTo("#s3-card", { scale: 0.5, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.6);

          // três afirmações — waterfall por linha
          const lines = gsap.utils.toArray("#s3-h2 .ln");
          [5.3, 6.05, 6.85].forEach((t, i) => {
            tl.set(lines[i], { opacity: 1, y: 70 }, t);
            tl.to(lines[i], { y: 0, duration: 0.2, ease: "power4.out" }, t);
          });

          window.__timelines["s3-portanto"] = tl;
        })();
      </script>
