      <script>
        (function () {
          const contacts = [
            ["CA", "Carla · Apto Centro", "Você: Te mando as fotos", "8:58", "#9fc3bd"],
            ["RL", "Roberto Lima", "Você: Bom dia, Roberto!", "8:57", "#d9c7a3"],
            ["JU", "Juliana (Jardins)", "Você: Posso te ligar hoje?", "8:55", "#b7c9a8"],
            ["MS", "Marcos · casa 3 quartos", "Você: Segue a planta", "8:52", "#c9b2c4"],
            ["FE", "Fernanda", "Você: O condomínio é R$ 680", "8:49", "#a8bccf"],
            ["PS", "Paulo Souza", "Você: Visita confirmada?", "8:44", "#d4b8a0"],
            ["AB", "Ana Beatriz", "Você: Tem vaga de garagem sim", "8:41", "#9fc3bd"],
            ["LM", "Lucas M.", "Você: Mandei o endereço", "8:37", "#d9c7a3"],
            ["RE", "Renata · locação", "Você: Aceita pet, sim!", "8:30", "#b7c9a8"],
            ["DG", "Diego", "Você: Bom dia, Diego!", "8:26", "#c9b2c4"],
            ["TA", "Tatiane", "Você: Te mando o vídeo", "8:21", "#a8bccf"],
            ["GU", "Gustavo · cobertura", "Você: Pode ser às 15h?", "8:15", "#d4b8a0"],
            ["CL", "Cláudia", "Você: Documentos recebidos", "8:09", "#9fc3bd"],
            ["VI", "Vinícius", "Você: Bom dia!", "8:02", "#d9c7a3"],
          ];
          const list = document.getElementById("s1-list");
          list.innerHTML = contacts
            .map(
              (c) =>
                `<div class="s1-row"><div class="s1-av" style="background:${c[4]}">${c[0]}</div>` +
                `<div class="s1-txt"><div class="s1-name" data-layout-allow-overlap>${c[1]}</div><div class="s1-prev" data-layout-allow-overlap>${c[2]}</div></div>` +
                `<div class="s1-meta" data-layout-allow-overlap>${c[3]}</div></div>`,
            )
            .join("");

          const tl = gsap.timeline({ paused: true });
          const F = 1 / 30;

          // telefone entra subindo
          tl.fromTo("#s1-phone-wrap", { y: 520 }, { y: 0, duration: 1.0, ease: "power3.out" }, 0.1);
          // glow ambiente respirando
          tl.fromTo("#s1-glow", { scale: 0.92, opacity: 0.7 }, { scale: 1.06, opacity: 1, duration: 3.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // título 1 — waterfall
          const t1 = gsap.utils.toArray("#s1-t1 .w");
          tl.set(t1[0], { opacity: 1, y: 80 }, 0.35);
          tl.to(t1[0], { y: 0, duration: 0.2, ease: "power4.out" }, 0.35);
          tl.set(t1[1], { opacity: 1, y: 60 }, 0.35 + 0.2 + 2 * F);
          tl.to(t1[1], { y: 0, duration: 0.16, ease: "power4.out" }, 0.35 + 0.2 + 2 * F);
          tl.to("#s1-t1", { y: -50, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.75);

          // título 2 — waterfall palavra a palavra
          const t2 = gsap.utils.toArray("#s1-t2 .w");
          let at = 3.1;
          t2.forEach((el, i) => {
            const heavy = i === 3 || i === 4 || i === 6;
            const dur = heavy ? 0.17 : 0.13;
            tl.set(el, { opacity: 1, y: heavy ? 64 : 44 }, at);
            tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, at);
            at += dur - F;
          });
          tl.to("#s1-t2", { opacity: 0, duration: 0.12, ease: "none" }, 6.95);

          // lista rolando — nudge-curve em quatro empurrões
          const steps = [
            [2.6, 0, -272],
            [3.9, -272, -544],
            [5.15, -544, -816],
            [6.3, -816, -1020],
          ];
          steps.forEach(([t, from, to]) => {
            const d = to - from;
            tl.fromTo("#s1-list", { y: from }, { y: from + d * 0.1, duration: 0.12, ease: "power3.in", immediateRender: false }, t);
            tl.to("#s1-list", { y: from + d * 0.75, duration: 0.1, ease: "none" }, t + 0.12);
            tl.to("#s1-list", { y: to, duration: 0.36, ease: "power4.out" }, t + 0.22);
          });

          // mensagens saindo — pop + sobe e some
          ["#s1-b1", "#s1-b2", "#s1-b3", "#s1-b4"].forEach((id, i) => {
            const t = 3.4 + i * 0.8;
            tl.fromTo(id, { scale: 0, opacity: 0, y: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, t);
            tl.to(id, { y: -420, opacity: 0, duration: 0.6, ease: "power2.in" }, t + 0.45);
          });

          // 7.0 — a tela trava: tremor quantizado (chromatic-glitch, envelope + hash)
          const glitchHash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const amp = { a: 0 };
          tl.set(amp, { a: 1 }, 7.0);
          tl.to(
            amp,
            {
              a: 0,
              duration: 0.32,
              ease: "power3.in",
              onUpdate: () => {
                const step = Math.floor(tl.time() / (1 / 15));
                gsap.set("#s1-screen", {
                  x: (glitchHash(step * 13) * 2 - 1) * 14 * amp.a,
                  y: (glitchHash(step * 29 + 7) * 2 - 1) * 6 * amp.a,
                });
              },
            },
            7.0,
          );
          tl.set("#s1-screen", { x: 0, y: 0 }, 7.32);
          tl.fromTo("#s1-dim", { opacity: 0 }, { opacity: 0.62, duration: 0.2, ease: "power2.out" }, 7.05);
          // as conversas somem junto com o número
          tl.fromTo("#s1-listmask", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.25);

          // 7.3 — aviso vermelho
          tl.fromTo("#s1-alert", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 7.3);
          tl.fromTo("#s1-alert-icon", { rotation: -30 }, { rotation: 0, duration: 0.5, ease: "power3.out" }, 7.3);
          // leve aproximação do telefone enquanto o aviso é lido
          tl.fromTo("#s1-phone-wrap", { scale: 1 }, { scale: 1.06, duration: 1.9, ease: "sine.out", immediateRender: false }, 7.35);

          window.__timelines["s1-cena"] = tl;
        })();
      </script>
