<script>
const DUR = 47;
let seed = 20261030;
const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;

const tl = gsap.timeline({ paused: true });
const F = (target, from, to, at) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), at);
const OUT = (el, at) => F(el, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, at);

// tempos de cada palavra: ElevenLabs Scribe sobre a narração (voz Sandro Dutra)
function lines(id, top, rows, light) {
  const ln = document.createElement("div"); ln.className = "ln" + (light ? " lt" : ""); ln.id = id; ln.style.top = top + "px";
  rows.forEach(([cls, ws]) => {
    const row = document.createElement("div"); row.className = "row " + cls;
    ws.forEach(([w, t, extra]) => {
      const s = document.createElement("span"); s.className = "w" + (extra ? " " + extra : ""); s.textContent = w; row.appendChild(s);
      const big = cls !== "sm";
      F(s, { opacity: 0, yPercent: big ? 45 : 35, filter: "blur(10px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: big ? 0.5 : 0.4, ease: big ? "back.out(1.5)" : "expo.out" }, Math.max(0, t - 0.04));
    });
    ln.appendChild(row);
  });
  $("#type").appendChild(ln);
  return ln;
}
function centered(sel, ws) {
  const el = $(sel);
  ws.forEach(([w, t, extra]) => {
    const s = document.createElement("span"); s.className = "w" + (extra ? " " + extra : ""); s.textContent = w; el.appendChild(s);
    F(s, { opacity: 0, yPercent: 45, filter: "blur(10px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.5)" }, t - 0.04);
  });
}

// ---------------- câmera ----------------
F("#world", { transformPerspective: 2400, rotationX: 4, rotationY: -2, scale: 1 }, { rotationX: -1, rotationY: 2, scale: 1.03, duration: DUR, ease: "none" }, 0);
F("#type", { x: 0 }, { x: -12, duration: DUR, ease: "none" }, 0);

// ---------------- o circuito de espera: tudo calculado a partir do tempo ----------------
const CY = 1000, L = 360, R = 130, X0 = 360, P = 2 * L + 2 * Math.PI * R;
function race(s) { // s em [0,1): posição e rumo no oval (sentido horário)
  let d = ((s % 1) + 1) % 1 * P;
  if (d < L) return [X0 + d, CY - R, 90];
  d -= L; const arc = Math.PI * R;
  if (d < arc) { const a = -Math.PI / 2 + d / R; return [X0 + L + Math.cos(a) * R, CY + Math.sin(a) * R, 90 + (d / R) * 180 / Math.PI]; }
  d -= arc;
  if (d < L) return [X0 + L - d, CY + R, 270];
  d -= L; const a = Math.PI / 2 + d / R; return [X0 + Math.cos(a) * R, CY + Math.sin(a) * R, 270 + (d / R) * 180 / Math.PI];
}
function bez(p0, p1, p2, p3, u) {
  const m = 1 - u;
  const x = m * m * m * p0[0] + 3 * m * m * u * p1[0] + 3 * m * u * u * p2[0] + u * u * u * p3[0];
  const y = m * m * m * p0[1] + 3 * m * m * u * p1[1] + 3 * m * u * u * p2[1] + u * u * u * p3[1];
  const dx = 3 * m * m * (p1[0] - p0[0]) + 6 * m * u * (p2[0] - p1[0]) + 3 * u * u * (p3[0] - p2[0]);
  const dy = 3 * m * m * (p1[1] - p0[1]) + 6 * m * u * (p2[1] - p1[1]) + 3 * u * u * (p3[1] - p2[1]);
  return [x, y, Math.atan2(dy, dx) * 180 / Math.PI + 90];
}
const LAP = 9;
const PLANE = "M0 -30 L6 -10 L28 2 L28 8 L6 3 L4 20 L12 26 L12 30 L0 27 L-12 30 L-12 26 L-4 20 L-6 3 L-28 8 L-28 2 L-6 -10 Z";
const NS = "http://www.w3.org/2000/svg";
const pl = {};
["A", "B", "C", "D", "E"].forEach((k) => { const g = document.createElementNS(NS, "g"); const p = document.createElementNS(NS, "path"); p.setAttribute("d", PLANE); p.setAttribute("fill", "#101010"); g.appendChild(p); $("#planes").appendChild(g); pl[k] = g; });
const T_EXIT = 18.4, A_EXIT = race(T_EXIT / LAP + 0.25);
function put(g, x, y, h, op = 1, s = 1) { g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + h.toFixed(1) + ") scale(" + s + ")"); g.setAttribute("opacity", op); }
function radarAt(t) {
  $("#sweep").setAttribute("transform", "rotate(" + ((t * 90) % 360).toFixed(1) + " 540 1000)");
  $("#sweep2").setAttribute("transform", "rotate(" + ((t * 90) % 360).toFixed(1) + " 540 700)");
  // B e C dão voltas o tempo todo
  const [bx, by, bh] = race(t / LAP + 0.55); put(pl.B, bx, by, bh);
  const [cx, cy, ch] = race(t / LAP + 0.85); put(pl.C, cx, cy, ch);
  // A: o primeiro da fila, sai do oval e pousa
  if (t < T_EXIT) { const [x, y, h] = race(t / LAP + 0.25); put(pl.A, x, y, h); }
  else if (t < 19.7) { const u = ease(seg(t, T_EXIT, 19.7)); const [x, y, h] = bez(A_EXIT, [A_EXIT[0] + 220, A_EXIT[1] + 160], [1080, 1480], [900, 1480], u); put(pl.A, x, y, h); }
  else { const u = eOut(seg(t, 19.7, 20.9)); put(pl.A, lerp(900, 330, u), 1480, 270, 1 - seg(t, 21.0, 21.4)); }
  // D: entra em espera no "espera"
  if (t < 8.3) put(pl.D, -80, 640, 120, 0);
  else if (t < 9.6) { const u = ease(seg(t, 8.3, 9.6)); put(pl.D, lerp(-60, X0, u), lerp(640, CY - R, u), 110 - 20 * u, 1); }
  else { const [x, y, h] = race((t - 9.6) / LAP); put(pl.D, x, y, h); }
  // E: o avião que ocupa a pista
  if (t < 4.2) put(pl.E, 1200, 1480, 270, 0);
  else { const u = eOut(seg(t, 4.2, 7.2)); put(pl.E, lerp(1180, 260, u), 1480, 270, 1 - seg(t, 7.4, 8.0)); }
}
const rk = { t: 0 };
F(rk, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => radarAt(rk.t) }, 0);
radarAt(0);

// ---------------- 1. gancho (escrito no quadro 1) ----------------
OUT("#h1", 3.9);
// ---------------- 2. a mecânica ----------------
const h2 = lines("h2", 230, [["sm", [["Quando", 4.16], ["a", 4.34], ["pista", 4.48], ["está", 4.76], ["ocupada,", 5.02]]], ["big", [["espera.", 8.36, "or"]]], ["serif", [["retas", 12.38], ["de", 12.82], ["1", 12.96], ["min.", 13.08]]]], true);
OUT(h2, 13.75);
F("#ovalHi", { strokeDashoffset: 1537 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 9.34);
F("#ovalHi", { opacity: 1 }, { opacity: 0.35, duration: 0.6 }, 14.0);
F("#fix", { opacity: 0, scale: 0.4, svgOrigin: "360 870" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 10.68);
