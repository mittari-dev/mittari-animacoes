<script>
const DUR = 28.4;
let seed = 20261027;
const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const $ = (s) => document.querySelector(s);


const tl = gsap.timeline({ paused: true });
const F = (target, from, to, at) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), at);
const OUT = (el, at) => F(el, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, at);

// tempos de cada palavra: ElevenLabs Scribe sobre a narração (voz Sandro Dutra)
function lines(id, top, rows) {
  const ln = document.createElement("div"); ln.className = "ln"; ln.id = id; ln.style.top = top + "px";
  rows.forEach(([cls, words]) => {
    const row = document.createElement("div"); row.className = "row " + cls;
    words.forEach(([w, t, extra]) => {
      const s = document.createElement("span"); s.className = "w" + (extra ? " " + extra : ""); s.textContent = w; row.appendChild(s);
      const big = cls !== "sm";
      F(s, { opacity: 0, yPercent: big ? 45 : 35, filter: "blur(10px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: big ? 0.5 : 0.4, ease: big ? "back.out(1.5)" : "expo.out" }, Math.max(0, t - 0.04));
    });
    ln.appendChild(row);
  });
  $("#type").appendChild(ln);
  return ln;
}

// ---------------- câmera ----------------
F("#world", { transformPerspective: 2400, rotationX: 3, rotationY: -2, scale: 1 }, { rotationX: -2, rotationY: 2, scale: 1.03, duration: DUR, ease: "none" }, 0);
F("#type", { x: 0 }, { x: -14, duration: DUR, ease: "none" }, 0);
F("#bg", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 4.5);
F("#glow", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 4.5);

// ---------------- 1-2. gancho e virada ----------------
F("#h1", { scale: 1 }, { scale: 1.04, duration: 2.2, ease: "none", transformOrigin: "0% 50%" }, 0);
document.querySelectorAll("#h1 .sk i").forEach((s, i) => F(s, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.22, ease: "power2.out" }, 2.3 + i * 0.09));
F("#h1", { y: 0, opacity: 1 }, { y: -330, opacity: 0.32, duration: 0.5, ease: "power3.inOut" }, 2.3);
const h2 = lines("h2", 700, [["big", [["Precisa", 2.36, "lm"], ["responder", 2.82, "lm"]]], ["big", [["os", 3.42], ["que", 3.56], ["já", 3.68], ["tem.", 3.88]]]]);
F("#h1", { opacity: 0.32 }, { opacity: 0, duration: 0.3 }, 4.6);
F(h2, { y: 0, opacity: 1, filter: "blur(0px)" }, { y: -260, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 4.6);

// ---------------- 3-4. o funil ----------------
const SRC_T = [5.9, 6.7, 8.24];
SRC_T.forEach((t, i) => F("#s" + i, { opacity: 0, y: 40, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t - 0.04));
F("#funnel", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 5.4);
const SRC_X = [210, 540, 870];
const TXT = ["Oi!", "Valor?", "Ainda tem?", "Fotos?", "Visita?", "Bairro?", "Oi, tudo bem?", "Vaga?", "Aceita FGTS?"];
// vagas dentro do funil, de baixo para cima; depois a pilha acima da boca
const rowsIn = [[1110, 1], [1040, 2], [970, 2], [900, 3], [830, 4]], rowsOver = [[760, 4], [690, 3], [620, 2]];
const slots = (rows) => rows.flatMap(([y, n]) => Array.from({ length: n }, (_, j) => [540 + (j - (n - 1) / 2) * 160, y]));
const IN_SLOTS = slots(rowsIn), OVER_SLOTS = slots(rowsOver);
const T_A = [5.95, 6.45, 6.75, 7.2, 7.55, 8.3, 8.75, 9.3, 9.9, 10.6, 11.4, 12.3];
const T_B = Array.from({ length: 9 }, (_, i) => 14.4 + i * 0.16);
const T_SPILL = 15.9;
let k = 0;
function bubble(t, slot, srcIdx, spill) {
  const b = document.createElement("div"); b.className = "bub"; b.textContent = TXT[k % TXT.length]; b.setAttribute("data-layout-ignore", "");
  if (b.textContent.length > 8) b.style.width = "230px";
  k++;
  $("#bubs").appendChild(b);
  const w = b.textContent.length > 8 ? 230 : 150;
  const sx = SRC_X[srcIdx] - w / 2, sy = 500, tx = slot[0] - w / 2, ty = slot[1] - 64;
  const rot = (rnd() - 0.5) * 16;
  F(b, { opacity: 0, x: sx, y: sy, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, t);
  F(b, { x: sx, y: sy }, { x: tx, y: ty, rotation: rot, duration: 0.55, ease: "power2.in" }, t + 0.12);
  F(b, { scaleY: 1 }, { scaleY: 0.86, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out", transformOrigin: "50% 100%" }, t + 0.67);
  if (spill) {
    const side = slot[0] < 540 ? -1 : 1;
    F(b, { x: tx, y: ty, rotation: rot }, { x: tx + side * (300 + rnd() * 160), y: 2150, rotation: rot + side * (90 + rnd() * 120), duration: 0.9 + rnd() * 0.3, ease: "power2.in" }, T_SPILL + rnd() * 0.35);
  }
  return t + 0.67;
}
T_A.forEach((t, i) => bubble(t, IN_SLOTS[i], i < 2 ? 0 : i % 3, i >= 8));
T_B.forEach((t, i) => bubble(t, OVER_SLOTS[i], i % 3, true));
F("#funnel", { x: 0 }, { x: 10, duration: 0.05, repeat: 7, yoyo: true, ease: "sine.inOut" }, T_SPILL);
// o contador de espera
F("#cnt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 9.7);
const clock = { v: 0 }, cv = $("#cntv");
const fmt = (v) => (v < 60 ? Math.floor(v) + " min" : Math.floor(v / 60) + " h" + (Math.floor(v % 60) ? " " + String(Math.floor(v % 60)).padStart(2, "0") : ""));
F(clock, { v: 0 }, { v: 180, duration: 1.35, ease: "power2.in", onUpdate: () => { cv.textContent = fmt(clock.v); cv.style.color = clock.v < 60 ? "#B8FF4F" : clock.v < 150 ? "#FF8A3D" : "#FF5A5E"; } }, 10.68);
F("#cnt", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 12.0);
F("#vis", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 12.4);
[0, 1, 2].forEach((i) => F("#s" + i, { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 13.95 + i * 0.05));
const h4 = lines("h4", 230, [["big", [["Mais", 14.38], ["cliente", 14.68]]], ["big", [["=", 15.86, "lm"], ["mais", 16.379], ["gente", 16.62]]], ["serif", [["esperando.", 16.86, "rd"]]]]);
OUT(h4, 17.7);
F("#fun", { opacity: 1, scale: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, scale: 0.9, y: 120, filter: "blur(12px)", duration: 0.45, ease: "power3.in" }, 17.65);

// ---------------- 5. as conversas de ontem ----------------
const ROWS = [["J", "Juliana", "Ainda tem?", "08:14", 0], ["M", "Marcos", "Qual o valor?", "09:02", 1], ["P", "Paula", "Aceita financiamento?", "10:37", 0], ["D", "Diego", "Dá pra visitar hoje?", "12:20", 0],
  ["R", "Renata", "Tem garagem?", "14:05", 1], ["C", "Caio", "Manda as fotos?", "16:48", 0], ["B", "Bia", "Ainda está disponível?", "19:31", 0], ["L", "Léo", "Qual o bairro?", "22:10", 0]];
const T_FLAG = [20.5, 20.85, 21.2, 21.55, 21.9, 22.25];
let nf = 0;
