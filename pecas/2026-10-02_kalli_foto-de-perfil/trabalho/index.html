<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/archivo-latin.woff2") format("woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0f1718; }
      #root { position: relative; width: 100%; height: 100%; background: #0f1718; overflow: hidden; }
      .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .glow { position: absolute; width: 900px; height: 900px; left: 90px; top: 90px; border-radius: 50%;
        background: radial-gradient(circle, rgba(198,244,50,0.22) 0%, rgba(198,244,50,0) 65%); }
      .mark { position: relative; font-family: Archivo, sans-serif; font-weight: 900; font-size: 300px; letter-spacing: -0.04em; color: #c6f432; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="1">
      <section id="av" class="clip" data-start="0" data-duration="1"><div class="glow"></div><div class="mark">Kalli</div></section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
